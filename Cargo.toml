[package]
name = "weyes"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
ctrlc = { version = "3.5.2", features = ["termination"] }
memmap2 = "0.9.11"
rustix = { version = "1.1.5", features = ["event", "fs", "mm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny-skia = "0.12.0"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
zbus = "5.19.0"
